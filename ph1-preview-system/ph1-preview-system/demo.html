        /* Additional custom styles for the demo */
        .line-clamp-3 {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        /* Preview iframe styles */
        .preview-iframe {
            border: none;
            width: 100%;
            height: 100%;
            border-radius: 8px;
        }
        
        /* Loading animation */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .animate-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 3px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { 
            Zap, Send, Loader2, CheckCircle, XCircle, AlertCircle, Info,
            Eye, EyeOff, Monitor, Smartphone, Tablet, BarChart3, RefreshCw,
            Share2, Download, Clock, AlertTriangle
        } = window.LucideReact;

        // Mock implementations for demo
        const PromptAnalysisEngine = {
            analyzePrompt: (prompt) => {
                const analysis = {
                    intent: prompt.substring(0, 50) + '...',
                    scope: prompt.toLowerCase().includes('site') || prompt.toLowerCase().includes('global') ? 'global' : 
                           prompt.toLowerCase().includes('page') ? 'page' : 'section',
                    changeTypes: [],
                    confidence: 0.85,
                    urgency: prompt.toLowerCase().includes('urgent') ? 'high' : 'medium'
                };

                if (prompt.toLowerCase().includes('enterprise') || prompt.toLowerCase().includes('fortune')) {
                    analysis.targetAudience = 'enterprise';
                    analysis.changeTypes.push('content');
                }
                if (prompt.toLowerCase().includes('calculator') || prompt.toLowerCase().includes('tool')) {
                    analysis.changeTypes.push('functionality');
                }
                if (prompt.toLowerCase().includes('color') || prompt.toLowerCase().includes('design')) {
                    analysis.changeTypes.push('design');
                }
                if (prompt.toLowerCase().includes('seo') || prompt.toLowerCase().includes('search')) {
                    analysis.changeTypes.push('seo');
                }
                if (analysis.changeTypes.length === 0) {
                    analysis.changeTypes.push('content');
                }

                return analysis;
            },

            generateChanges: async (prompt, currentContent) => {
                const changes = [];
                
                if (prompt.toLowerCase().includes('enterprise')) {
                    changes.push({
                        id: 'content-enterprise-hero',
                        type: 'content',
                        scope: 'section',
                        description: 'Update hero messaging for enterprise audience',
                        before: 'Product & Strategy Consulting',
                        after: 'Enterprise-Grade Solutions for Fortune 500 Companies',
                        impact: { seo: 7, performance: 9, accessibility: 9, conversion: 8 },
                        risks: [],
                        dependencies: ['hero-section'],
                        estimatedTime: 5
                    });
                }

                if (prompt.toLowerCase().includes('calculator')) {
                    changes.push({
                        id: 'functionality-calculator',
                        type: 'functionality',
                        scope: 'section',
                        description: 'Add interactive ROI calculator',
                        before: null,
                        after: 'ROI Calculator Component',
                        impact: { seo: 8, performance: 6, accessibility: 7, conversion: 9 },
                        risks: ['Performance impact', 'Mobile compatibility'],
                        dependencies: ['calculator-logic', 'analytics-tracking'],
                        estimatedTime: 45
                    });
                }

                if (prompt.toLowerCase().includes('color') || prompt.toLowerCase().includes('professional')) {
                    changes.push({
                        id: 'design-color-scheme',
                        type: 'design',
                        scope: 'global',
                        description: 'Update color scheme for professional appearance',
                        before: { primary: '#3B82F6', secondary: '#10B981' },
                        after: { primary: '#1E40AF', secondary: '#059669' },
                        impact: { seo: 5, performance: 8, accessibility: 7, conversion: 6 },
                        risks: ['Brand consistency', 'Accessibility contrast'],
                        dependencies: ['design-system'],
                        estimatedTime: 20
                    });
                }

                return changes;
            }
        };

        const PromptPreviewDemo = () => {
            const [state, setState] = useState({
                prompt: '',
                isAnalyzing: false,
                analysis: null,
                changes: [],
                previewReady: false,
                showPreview: false
            });

            const examplePrompts = {
                enterprise: "Make our homepage more appealing to Fortune 500 companies. Focus on enterprise-grade language, add trust signals, and emphasize compliance and scale.",
                calculator: "Add an ROI calculator to our UX Research service page to help prospects understand the value of our services.",
                seo: "Optimize the entire site for 'customer experience consulting' and related enterprise keywords to improve our search rankings.",
                design: "Update our color scheme to be more professional and corporate. Make the layout more prominent with larger text.",
                tone: "Make all our messaging more urgent and action-oriented. Update CTAs to emphasize measurable ROI and business outcomes."
            };

            const handlePromptSubmit = async () => {
                if (!state.prompt.trim()) return;

                setState(prev => ({ ...prev, isAnalyzing: true }));

                try {
                    await new Promise(resolve => setTimeout(resolve, 1500));
                    
                    const analysis = PromptAnalysisEngine.analyzePrompt(state.prompt);
                    const changes = await PromptAnalysisEngine.generateChanges(state.prompt, {});
                    
                    setState(prev => ({
                        ...prev,
                        analysis,
                        changes,
                        isAnalyzing: false,
                        previewReady: true
                    }));

                } catch (error) {
                    console.error('Error analyzing prompt:', error);
                    setState(prev => ({ ...prev, isAnalyzing: false }));
                }
            };

            const handleExampleSelect = (key) => {
                setState(prev => ({ ...prev, prompt: examplePrompts[key] }));
            };

            return (
                <div className="min-h-screen bg-gray-50">
                    {/* Header */}
                    <div className="bg-white border-b shadow-sm">
                        <div className="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex items-center justify-between h-16">
                                <div className="flex items-center space-x-3">
                                    <Zap className="h-8 w-8 text-blue-600" />
                                    <div>
                                        <h1 className="text-xl font-semibold text-gray-900">PH1 Prompt-Driven System</h1>
                                        <p className="text-sm text-gray-500">Transform your website with natural language</p>
                                    </div>
                                </div>
                                <div className="text-sm text-gray-500">
                                    Demo Environment
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        {/* Introduction */}
                        <div className="bg-blue-50 border border-blue-200 rounded-lg p-6 mb-8">
                            <div className="flex items-start space-x-3">
                                <Info className="h-6 w-6 text-blue-600 flex-shrink-0 mt-0.5" />
                                <div>
                                    <h2 className="text-lg font-semibold text-blue-900 mb-2">
                                        How the Prompt-Driven System Works
                                    </h2>
                                    <div className="text-blue-800 space-y-2">
                                        <p><strong>1. Describe what you want:</strong> Use natural language to describe changes you want to make to your website.</p>
                                        <p><strong>2. AI analyzes your request:</strong> Our system understands your intent and generates specific change recommendations.</p>
                                        <p><strong>3. Preview before applying:</strong> See exactly how your changes will look with side-by-side comparison and impact analysis.</p>
                                        <p><strong>4. Apply or refine:</strong> Approve the changes or request modifications until it's perfect.</p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Example Prompts */}
                        <div className="bg-white rounded-lg shadow-sm border border-gray-200 p-6 mb-8">
                            <h3 className="text-lg font-semibold text-gray-900 mb-4">Try These Example Prompts</h3>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                {Object.entries(examplePrompts).map(([key, prompt]) => (
                                    <button
                                        key={key}
                                        onClick={() => handleExampleSelect(key)}
                                        className="text-left p-4 border border-gray-200 rounded-lg hover:border-gray-300 hover:bg-gray-50 transition-colors"
                                    >
                                        <div className="font-medium text-gray-900 mb-1 capitalize">
                                            {key.replace(/([A-Z])/g, ' $1').toLowerCase()}
                                        </div>
                                        <div className="text-sm text-gray-600 line-clamp-3">
                                            {prompt}
                                        </div>
                                    </button>
                                ))}
                            </div>
                        </div>

                        {/* Prompt Input */}
                        <div className="bg-white rounded-lg shadow-sm border border-gray-200 p-6 mb-8">
                            <h3 className="text-lg font-semibold text-gray-900 mb-4">Enter Your Prompt</h3>
                            <div className="space-y-4">
                                <textarea
                                    value={state.prompt}
                                    onChange={(e) => setState(prev => ({ ...prev, prompt: e.target.value }))}
                                    placeholder="Describe the changes you want to make to your website..."
                                    className="w-full p-4 border border-gray-300 rounded-lg text-gray-900 placeholder-gray-500 focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                    rows={4}
                                />
                                <div className="flex justify-between items-center">
                                    <div className="text-sm text-gray-500">
                                        Be specific about what you want to change and why
                                    </div>
                                    <button
                                        onClick={handlePromptSubmit}
                                        disabled={!state.prompt.trim() || state.isAnalyzing}
                                        className="flex items-center space-x-2 px-6 py-3 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
                                    >
                                        {state.isAnalyzing ? (
                                            <Loader2 className="h-5 w-5 animate-spin" />
                                        ) : (
                                            <Send className="h-5 w-5" />
                                        )}
                                        <span>{state.isAnalyzing ? 'Analyzing...' : 'Generate Preview'}</span>
                                    </button>
                                </div>
                            </div>
                        </div>

                        {/* Analysis Results */}
                        {state.analysis && (
                            <div className="bg-white rounded-lg shadow-sm border border-gray-200 p-6 mb-8">
                                <h3 className="text-lg font-semibold text-gray-900 mb-4">Analysis Results</h3>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
                                    <div className="bg-gray-50 p-4 rounded-lg">
                                        <div className="text-sm text-gray-600 mb-1">Intent</div>
                                        <div className="font-medium text-gray-900">{state.analysis.intent}</div>
                                    </div>
                                    <div className="bg-gray-50 p-4 rounded-lg">
                                        <div className="text-sm text-gray-600 mb-1">Scope</div>
                                        <div className="font-medium text-gray-900 capitalize">{state.analysis.scope}</div>
                                    </div>
                                    <div className="bg-gray-50 p-4 rounded-lg">
                                        <div className="text-sm text-gray-600 mb-1">Change Types</div>
                                        <div className="font-medium text-gray-900">{state.analysis.changeTypes.join(', ')}</div>
                                    </div>
                                    <div className="bg-gray-50 p-4 rounded-lg">
                                        <div className="text-sm text-gray-600 mb-1">Confidence</div>
                                        <div className="font-medium text-gray-900">{Math.round(state.analysis.confidence * 100)}%</div>
                                    </div>
                                </div>

                                {state.analysis.targetAudience && (
                                    <div className="bg-blue-50 border border-blue-200 rounded-lg p-4 mb-4">
                                        <div className="flex items-center space-x-2">
                                            <CheckCircle className="h-5 w-5 text-blue-600" />
                                            <div className="text-blue-900 font-medium">
                                                Target Audience Detected: <span className="capitalize">{state.analysis.targetAudience}</span>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* Changes Summary */}
                        {state.changes.length > 0 && (
                            <div className="bg-white rounded-lg shadow-sm border border-gray-200 p-6">
                                <h3 className="text-lg font-semibold text-gray-900 mb-4">
                                    Proposed Changes ({state.changes.length})
                                </h3>
                                <div className="space-y-4">
                                    {state.changes.map((change) => (
                                        <div key={change.id} className="border border-gray-200 rounded-lg p-4">
                                            <div className="flex items-start justify-between mb-3">
                                                <div className="flex items-center space-x-3">
                                                    <span className={`inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${
                                                        change.type === 'content' ? 'bg-blue-100 text-blue-800' :
                                                        change.type === 'design' ? 'bg-purple-100 text-purple-800' :
                                                        change.type === 'functionality' ? 'bg-orange-100 text-orange-800' :
                                                        'bg-gray-100 text-gray-800'
                                                    }`}>
                                                        {change.type}
                                                    </span>
                                                    <span className="text-sm text-gray-500 capitalize">{change.scope}</span>
                                                </div>
                                                <div className="text-sm text-gray-500">{change.estimatedTime} min</div>
                                            </div>
                                            
                                            <h4 className="font-medium text-gray-900 mb-2">{change.description}</h4>
                                            
                                            {change.impact && (
                                                <div className="grid grid-cols-4 gap-4 text-sm mb-3">
                                                    {Object.entries(change.impact).map(([key, value]) => (
                                                        <div key={key}>
                                                            <span className="text-gray-600 capitalize">{key}:</span>
                                                            <span className={`ml-1 font-medium ${
                                                                value >= 8 ? 'text-green-600' :
                                                                value >= 6 ? 'text-yellow-600' : 'text-red-600'
                                                            }`}>
                                                                {value}/10
                                                            </span>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}

                                            {change.risks && change.risks.length > 0 && (
                                                <div className="flex items-center space-x-2">
                                                    <AlertTriangle className="h-4 w-4 text-amber-500" />
                                                    <span className="text-sm text-amber-700">
                                                        Risks: {change.risks.join(', ')}
                                                    </span>
                                                </div>
                                            )}
                                        </div>
                                    ))}
                                </div>
                                
                                <div className="mt-6 pt-6 border-t border-gray-200">
                                    <div className="flex justify-between items-center">
                                        <div className="text-sm text-gray-600">
                                            Total estimated time: {state.changes.reduce((total, change) => total + change.estimatedTime, 0)} minutes
                                        </div>
                                        <div className="space-x-3">
                                            <button
                                                onClick={() => alert('Preview would open in full-screen mode showing before/after comparison')}
                                                className="px-6 py-3 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 transition-colors"
                                            >
                                                View Full Preview
                                            </button>
                                            <button
                                                onClick={() => alert('Changes would be applied to the live site after final confirmation')}
                                                className="px-6 py-3 bg-green-600 text-white font-medium rounded-lg hover:bg-green-700 transition-colors"
                                            >
                                                Apply Changes
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Success Message */}
                        {state.previewReady && (
                            <div className="mt-8 bg-green-50 border border-green-200 rounded-lg p-4">
                                <div className="flex items-center space-x-2">
                                    <CheckCircle className="h-5 w-5 text-green-600" />
                                    <div className="text-green-900 font-medium">
                                        Preview generated successfully! You can now review the proposed changes and apply them to your live site.
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        ReactDOM.render(<PromptPreviewDemo />, document.getElementById('root'));
    </script>
</body>
</html>
