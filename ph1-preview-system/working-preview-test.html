<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PH1 Preview System - Working Test</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; padding: 0; background: #f9fafb; }
        .preview-frame { border: 1px solid #e5e7eb; border-radius: 8px; background: white; }
        .changed-element { outline: 2px solid #3B82F6; outline-offset: 2px; position: relative; }
        .changed-element::after { 
            content: "Modified"; 
            position: absolute; 
            top: -8px; 
            right: -8px; 
            background: #3B82F6; 
            color: white; 
            font-size: 0.7rem; 
            padding: 2px 6px; 
            border-radius: 4px; 
            font-weight: 600; 
        }
        .animate-spin { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Simple working preview system
        function WorkingPreviewTest() {

            const [device, setDevice] = useState('desktop');

                        .service-icon { font-size: 2rem; margin-bottom: 1rem; }
                        .calculator { background: #e0f2fe; border: 2px solid #0369a1; border-radius: 8px; padding: 1rem; margin: 1rem 0; ${hasCalculator ? 'outline: 2px solid #fbbf24; outline-offset: 4px;' : ''} }

                        .calc-btn { background: #0369a1; color: white; border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; }

                                <div class="service-icon">🔍</div>
                                <h3>UX Research</h3>
                                <p>Deep user insights to guide product decisions</p>
                                ${hasCalculator ? `
                                    <div class="calculator">

                                        <input type="number" class="calc-input" placeholder="Current conversion rate %" />

                                <h3>Product Strategy</h3>

                            </div>

                                <div class="service-icon">💡</div>
                                <h3>Innovation Consulting</h3>
                                <p>Transform ideas into market-ready solutions</p>
                            </div>
                        </div>
                    </div>
                `;
            };

                                    <div className="w-16 h-16 bg-blue-600 rounded-lg flex items-center justify-center mx-auto mb-4">

                                    </div>

                                        <ul className="text-sm text-blue-800 space-y-1">

                                            <li>• Device simulation</li>
                                            <li>• Change highlighting</li>
                                            <li>• Impact analysis</li>

                                    <div className="p-4 bg-purple-50 rounded-lg">

                                            <li>• ROI calculator addition</li>
                                            <li>• CTA modifications</li>
                                            <li>• Visual highlighting</li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                );

            return (

                    {/* Header */}
                    <div className="bg-white border-b shadow-sm">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex items-center justify-between h-16">
                                <div className="flex items-center space-x-3">
                                    <svg className="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                                    </svg>

                                    </div>
                                </div>

                                    {/* Device Toggle */}
                                    <div className="flex items-center bg-gray-100 rounded-lg p-1">
                                        <button
                                            onClick={() => setDevice('desktop')}
                                            className={`p-2 rounded ${device === 'desktop' ? 'bg-white shadow-sm' : ''}`}
                                        >
                                            🖥️
                                        </button>
                                        <button
                                            onClick={() => setDevice('tablet')}
                                            className={`p-2 rounded ${device === 'tablet' ? 'bg-white shadow-sm' : ''}`}
                                        >
                                            📱
                                        </button>
                                        <button
                                            onClick={() => setDevice('mobile')}
                                            className={`p-2 rounded ${device === 'mobile' ? 'bg-white shadow-sm' : ''}`}
                                        >

                                    </div>

                                    <button

                        {/* Left Sidebar */}

                                                Functionality
                                            </span>
                                            <span className="text-sm text-gray-500">15 min</span>
                                        </div>
                                        <h4 className="font-medium text-gray-900 mb-1">ROI Calculator</h4>
                                        <p className="text-sm text-gray-600">Added interactive calculator to UX Research</p>
                                        <div className="mt-2 text-xs text-green-600">✅ Applied</div>
                                    </div>

                                    <div className="p-4 border border-blue-200 rounded-lg bg-blue-50">
                                        <div className="flex items-center justify-between mb-2">
                                            <span className="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium bg-blue-100 text-blue-800">
                                                Content
                                            </span>
                                            <span className="text-sm text-gray-500">10 min</span>
                                        </div>
                                        <h4 className="font-medium text-gray-900 mb-1">Enterprise CTAs</h4>
                                        <p className="text-sm text-gray-600">Updated all buttons to "Schedule Consultation"</p>
                                        <div className="mt-2 text-xs text-green-600">✅ Applied</div>
                                    </div>
                                </div>

                                <div className="mt-6 p-4 bg-green-50 border border-green-200 rounded-lg">
                                    <h3 className="font-semibold text-green-900 mb-2">📊 Impact Analysis</h3>
                                    <div className="space-y-2 text-sm">
                                        <div className="flex justify-between">
                                            <span className="text-gray-600">SEO Impact</span>
                                            <span className="font-medium text-green-600">8/10</span>
                                        </div>
                                        <div className="flex justify-between">
                                            <span className="text-gray-600">Conversion</span>
                                            <span className="font-medium text-green-600">9/10</span>
                                        </div>
                                        <div className="flex justify-between">
                                            <span className="text-gray-600">Performance</span>
                                            <span className="font-medium text-yellow-600">7/10</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Main Preview Area */}
                        <div className="flex-1 flex flex-col">
                            <div className="bg-white border-b px-6 py-3">
                                <div className="flex items-center justify-between">
                                    <div className="text-sm text-gray-600">
                                        ⚡ Live Preview - Changes highlighted in yellow
                                    </div>
                                    <div className="text-sm text-green-600 font-medium">
                                        ✅ No JSON Errors - System Working!
                                    </div>
                                </div>
                            </div>

                            <div className="flex-1 bg-gray-100 p-6">
                                <div className="flex space-x-6 h-full">
                                    {/* Before */}
                                    <div className="flex-1">
                                        <div className="bg-white rounded-lg shadow-sm p-2 h-full">
                                            <div className="text-xs text-gray-500 mb-2 px-2">BEFORE</div>
                                            <div className="preview-frame" style={deviceStyles[device]}>
                                                <iframe
                                                    srcDoc={generatePreviewHTML('before')}
                                                    style={{ width: '100%', height: '100%', border: 'none' }}
                                                />
                                            </div>
                                        </div>
                                    </div>
                                    
                                    {/* After */}
                                    <div className="flex-1">
                                        <div className="bg-white rounded-lg shadow-sm p-2 h-full">
                                            <div className="text-xs text-gray-500 mb-2 px-2">AFTER (with changes highlighted)</div>
                                            <div className="preview-frame" style={deviceStyles[device]}>
                                                <iframe
                                                    srcDoc={generatePreviewHTML('after')}
                                                    style={{ width: '100%', height: '100%', border: 'none' }}
                                                />
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Bottom Action Bar */}
                    <div className="bg-white border-t px-6 py-4 fixed bottom-0 left-0 right-0">
                        <div className="flex items-center justify-between max-w-7xl mx-auto">
                            <div className="text-sm text-green-600 font-medium">
                                ✅ Preview System Working Perfectly - No Errors!
                            </div>
                            
                            <div className="flex items-center space-x-4">
                                <button
                                    onClick={() => alert('❌ Changes rejected and reverted!')}
                                    className="px-4 py-2 border border-gray-300 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-50"
                                >
                                    Reject Changes
                                </button>
                                
                                <button
                                    onClick={() => alert('✅ Changes applied to live site successfully!')}
                                    className="px-6 py-2 bg-green-600 text-white rounded-lg text-sm font-medium hover:bg-green-700"
                                >
                                    ✅ Apply Changes to Live Site
                                </button>
                            </div>

                    </div>
                </div>

        }

        ReactDOM.render(<WorkingPreviewTest />, document.getElementById('root'));
    </script>
</body>
</html>
